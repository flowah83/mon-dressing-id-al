<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet" />
    <style>
      body { margin: 0; background: #f6f3ee; color: #1c1917; font-family: "Source Sans 3", sans-serif; }
      .sheet { width: 390px; padding: 36px 28px 42px; box-sizing: border-box; }
      .row { display: flex; align-items: center; gap: 14px; }
      h1 { font-family: Fraunces, Georgia, serif; font-weight: 500; font-size: 44px; margin: 0; letter-spacing: -0.03em; }
      .tag { margin: 4px 0 0; letter-spacing: 0.16em; text-transform: uppercase; font-size: 11px; font-weight: 600; color: #5c564e; }
      .voice { margin-top: 28px; font-family: Fraunces, Georgia, serif; font-size: 28px; line-height: 1.15; }
      .voice span { display: block; margin-top: 8px; font-family: "Source Sans 3", sans-serif; font-size: 15px; color: #5c564e; }
    </style>
  </head>
  <body>
    <div class="sheet">
      <div class="row">
        <img src="./icone.svg" width="72" height="72" alt="" />
        <div>
          <h1>Vestiaire</h1>
          <p class="tag">Le dressing qui t'habille</p>
        </div>
      </div>
      <p class="voice">
        Noté. Belle journée.
        <span>Ton du matin : calme, concret, jamais pressé.</span>
      </p>
    </div>
  </body>
</html>
