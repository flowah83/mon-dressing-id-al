<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Écran d'accueil — Vestiaire</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; height: 100%; }
      body {
        width: 390px;
        height: 844px;
        overflow: hidden;
        font-family: "Source Sans 3", "Gill Sans", sans-serif;
        color: #1c1917;
        background:
          radial-gradient(120% 80% at 20% 0%, #fbf7f2 0%, transparent 55%),
          radial-gradient(90% 70% at 100% 100%, #e7d3c4 0%, transparent 50%),
          #efe6dc;
      }
      .status {
        display: flex;
        justify-content: space-between;
        padding: 18px 28px 0;
        font-weight: 600;
        font-size: 15px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 22px 0;
        padding: 54px 22px 0;
        text-align: center;
      }
      .app { display: flex; flex-direction: column; align-items: center; gap: 6px; }
      .icon {
        width: 62px;
        height: 62px;
        border-radius: 14px;
        background: #d9d3cc;
        box-shadow: 0 8px 16px -12px #1c191740;
      }
      .icon.mail { background: linear-gradient(#8fa4b5, #6d8496); }
      .icon.cal { background: #fff; border: 1px solid #e4ddd4; }
      .icon.photos { background: linear-gradient(135deg, #e7b08a, #8f3d2b); }
      .icon.notes { background: #f3e4c8; }
      img.icon { object-fit: cover; background: #f6f3ee; }
      .label { font-size: 11px; letter-spacing: 0.01em; }
      .dock {
        position: absolute;
        left: 16px;
        right: 16px;
        bottom: 18px;
        display: flex;
        justify-content: space-around;
        padding: 14px 8px 16px;
        border-radius: 28px;
        background: #fffcf8cc;
      }
    </style>
  </head>
  <body>
    <div class="status"><span>9:41</span><span>LTE</span></div>
    <div class="grid">
      <div class="app"><div class="icon mail"></div><div class="label">Messages</div></div>
      <div class="app"><div class="icon cal"></div><div class="label">Calendrier</div></div>
      <div class="app"><div class="icon photos"></div><div class="label">Photos</div></div>
      <div class="app"><div class="icon notes"></div><div class="label">Notes</div></div>
      <div class="app">
        <img class="icon" src="./icone.svg" alt="" />
        <div class="label">Vestiaire</div>
      </div>
      <div class="app"><div class="icon"></div><div class="label">Plans</div></div>
      <div class="app"><div class="icon"></div><div class="label">Météo</div></div>
      <div class="app"><div class="icon"></div><div class="label">Réglages</div></div>
    </div>
    <div class="dock">
      <div class="icon mail" style="width:54px;height:54px"></div>
      <div class="icon photos" style="width:54px;height:54px"></div>
      <div class="icon notes" style="width:54px;height:54px"></div>
      <div class="icon" style="width:54px;height:54px"></div>
    </div>
  </body>
</html>
